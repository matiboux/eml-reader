name: Check CI

# GitHub variables:
# - VERSION_TAG
# - ASTRO_SITE_URL
# - ASTRO_BASE_PATH
# - ASTRO_ASSETS_PREFIX
# - CI_DISABLE_CHECKS (disable all checks)
# - CI_DISABLE_TESTS (disable all tests)
# - CI_DISABLE_TESTS_UNIT
# - CI_DISABLE_TESTS_E2E
# - CI_DISABLE_LINT (disable all lint checks)
# - CI_DISABLE_LINT_NODE
# - CI_DISABLE_LINT_DOCKER
# - CI_DISABLE_SECURITY (disable all security checks)
# - CI_DISABLE_SECURITY_AUDIT
# - CI_DISABLE_SECURITY_SECRETS

# GitHub secrets: N/A

on:

  # Run on pull requests to primary branches
  pull_request:
    branches:
      # Production
      - main
      # Staging
      - staging
      # Development
      - dev
    paths:
      # CI/CD files
      - '.github/workflows/check.yml'
      - 'docker-compose.yml'
      - 'docker-compose.cicd.yml'
      - '.github/actions/**'
      - 'scripts/**'
      - '.gitleaks-baseline.json'
      - '.env'
      # Application files
      - 'app/**'

  # Run on manual triggers
  workflow_dispatch:

# Set default GITHUB_TOKEN permissions for the workflow
permissions:
  contents: read

# Set workflow concurrency rules
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # Build job
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Only run if:
    # - Checks are not disabled
    if: |
      vars.CI_DISABLE_CHECKS != 'true'

    steps:

      # Initialization steps

      - name: Checkout
        uses: actions/checkout@v6
        with:
          # SECURITY: don't leave the GITHUB_TOKEN in .git/config for later steps.
          persist-credentials: false

      # Execution steps

      - name: Pull dependencies
        run: |
          # docker compose pull --ignore-buildable
          echo '::group::Pull details'
          docker compose \
            -f ./docker-compose.yml -f ./docker-compose.cicd.yml \
            --env-file .env \
            pull --ignore-buildable
          echo '::endgroup::'

      - name: Build for production
        env:
          # Build
          BUILD_CHECK: 'true' # Run type checks
          # Deployment
          GITHUB_REPOSITORY_URL: https://github.com/${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          VERSION_TAG: ${{ vars.VERSION_TAG }}
          # Astro
          ASTRO_SITE_URL: ${{ vars.ASTRO_SITE_URL }}
          ASTRO_BASE_PATH: ${{ vars.ASTRO_BASE_PATH }}
          ASTRO_ASSETS_PREFIX: ${{ vars.ASTRO_ASSETS_PREFIX }}
          # Application (app env vars)
          # (Add env vars for your application here.)
        run: |
          # docker compose build
          echo '::group::Build details'
          export DOCKER_UID="$(id -u)"
          docker compose \
            -f ./docker-compose.yml -f ./docker-compose.cicd.yml \
            --env-file .env \
            build
          echo '::endgroup::'

      - name: Copy application files
        run: |
          # docker compose up
          echo '::group::Run details'
          export DOCKER_UID="$(id -u)"
          docker compose \
            -f ./docker-compose.yml -f ./docker-compose.cicd.yml \
            --env-file .env \
            up
          echo '::endgroup::'

      - name: Check application files
        run: |
          # Check application files
          [ -d ./app/dist ] && [ $(ls -1 ./app/dist | wc -l) -gt 0 ] \
            && echo 'Application files found' \
            || ( echo 'No application files found' && exit 1 )

  # Test Unit job
  test-unit:
    name: Test Unit
    runs-on: ubuntu-slim
    timeout-minutes: 15

    # Only run if:
    # - Checks are not disabled
    # - Tests are not disabled
    # - Unit tests are not disabled
    if: |
      vars.CI_DISABLE_CHECKS != 'true' &&
      vars.CI_DISABLE_TESTS != 'true' &&
      vars.CI_DISABLE_TESTS_UNIT != 'true'

    steps:

      # Initialization steps

      - name: Checkout
        uses: actions/checkout@v6
        with:
          # SECURITY: don't leave the GITHUB_TOKEN in .git/config for later steps.
          persist-credentials: false

      # Dependency steps

      - name: Setup Node
        uses: ./.github/actions/setup-node

      # Execution steps

      - name: Run unit tests
        env:
          CI: 'true'
          APP_ENV: test
        run: pnpm run test:vitest
        working-directory: app

  # Test E2E job
  test-e2e:
    name: Test E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Only run if:
    # - Checks are not disabled
    # - Tests are not disabled
    # - E2E tests are not disabled
    if: |
      vars.CI_DISABLE_CHECKS != 'true' &&
      vars.CI_DISABLE_TESTS != 'true' &&
      vars.CI_DISABLE_TESTS_E2E != 'true'

    steps:

      # Initialization steps

      - name: Checkout
        uses: actions/checkout@v6
        with:
          # SECURITY: don't leave the GITHUB_TOKEN in .git/config for later steps.
          persist-credentials: false

      # Dependency steps

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Get Playwright version
        id: playwright
        working-directory: app
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
        working-directory: app

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
        working-directory: app

      # Execution steps

      - name: Build application
        env:
          APP_ENV: test
          # Deployment
          GITHUB_REPOSITORY_URL: https://github.com/${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          VERSION_TAG: ${{ vars.VERSION_TAG }}
          # Astro
          ASTRO_SITE_URL: ${{ vars.ASTRO_SITE_URL }}
          ASTRO_BASE_PATH: ${{ vars.ASTRO_BASE_PATH }}
          ASTRO_ASSETS_PREFIX: ${{ vars.ASTRO_ASSETS_PREFIX }}
          # Application (app env vars)
          # (Add env vars for your application here.)
        run: pnpm run build-only
        working-directory: app

      - name: Run e2e tests
        env:
          CI: 'true'
          APP_ENV: test
        run: pnpm run test:playwright
        working-directory: app

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-test-results
          path: app/test-results
          if-no-files-found: ignore
          retention-days: 7

  # Lint Node job
  lint-node:
    name: Lint Node
    runs-on: ubuntu-slim
    timeout-minutes: 10

    # Only run if:
    # - Checks are not disabled
    # - Lint checks are not disabled
    # - Node lint is not disabled
    if: |
      vars.CI_DISABLE_CHECKS != 'true' &&
      vars.CI_DISABLE_LINT != 'true' &&
      vars.CI_DISABLE_LINT_NODE != 'true'

    steps:

      # Initialization steps

      - name: Checkout
        uses: actions/checkout@v6
        with:
          # SECURITY: don't leave the GITHUB_TOKEN in .git/config for later steps.
          persist-credentials: false

      # Dependency steps

      - name: Setup Node
        uses: ./.github/actions/setup-node

      # Execution steps

      - name: Lint Node projects
        run: sh scripts/check_node_lint.sh

  # Lint Docker job
  lint-docker:
    name: Lint Docker
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Only run if:
    # - Checks are not disabled
    # - Lint checks are not disabled
    # - Docker lint is not disabled
    if: |
      vars.CI_DISABLE_CHECKS != 'true' &&
      vars.CI_DISABLE_LINT != 'true' &&
      vars.CI_DISABLE_LINT_DOCKER != 'true'

    steps:

      # Initialization steps

      - name: Checkout
        uses: actions/checkout@v6
        with:
          # SECURITY: don't leave the GITHUB_TOKEN in .git/config for later steps.
          persist-credentials: false

      # Execution steps

      - name: Lint Dockerfiles
        run: sh scripts/check_docker_lint.sh

  # Audit job
  audit:
    name: Audit
    runs-on: ubuntu-slim
    timeout-minutes: 10

    # Only run if:
    # - Checks are not disabled
    # - Security checks are not disabled
    # - Dependencies audit is not disabled
    if: |
      vars.CI_DISABLE_CHECKS != 'true' &&
      vars.CI_DISABLE_SECURITY != 'true' &&
      vars.CI_DISABLE_SECURITY_AUDIT != 'true'

    steps:

      # Initialization steps

      - name: Checkout
        uses: actions/checkout@v6
        with:
          # SECURITY: don't leave the GITHUB_TOKEN in .git/config for later steps.
          persist-credentials: false

      # Dependency steps

      - name: Setup Node
        uses: ./.github/actions/setup-node
        with:
          install: false

      # Execution steps

      - name: Audit Node dependencies
        run: sh scripts/check_node_audit.sh

  # Secrets scan job
  secrets:
    name: Secrets Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Only run if:
    # - Checks are not disabled
    # - Security checks are not disabled
    # - Secrets scan is not disabled
    if: |
      vars.CI_DISABLE_CHECKS != 'true' &&
      vars.CI_DISABLE_SECURITY != 'true' &&
      vars.CI_DISABLE_SECURITY_SECRETS != 'true'

    steps:

      # Initialization steps

      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history is needed to scan past commits
          fetch-depth: 0
          # SECURITY: don't leave the GITHUB_TOKEN in .git/config for later steps.
          persist-credentials: false

      # Execution steps

      - name: Scan git history for secrets
        run: sh scripts/check_secrets_scan.sh
